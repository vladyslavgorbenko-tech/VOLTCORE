<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLT CORE — системы хранения энергии LiFePO₄</title>
    <style>
        :root {
            --bg-dark: #0e1116;
            --bg-card: #161b22;
            --bg-light: #f6f8fa;
            --text-main: #1f2328;
            --text-muted: #656d76;
            --text-light: #f0f6fc;
            --accent: #00b894;
            --accent-hover: #009c7d;
            --border: #d0d7de;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            color: var(--text-main);
            background-color: #ffffff;
            line-height: 1.5;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(14, 17, 22, 0.92);
            backdrop-filter: blur(10px);
            color: var(--text-light);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
        }

        .logo span {
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 28px;
        }

        nav a {
            color: #c9d1d9;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #fff;
        }

        .cart-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .cart-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .cart-count {
            background: var(--accent);
            color: #0e1116;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .cart-btn:hover .cart-count {
            background: #fff;
        }

        /* Hero Section */
        .hero {
            background: var(--bg-dark);
            color: var(--text-light);
            padding: 90px 0 80px;
        }

        .badge-top {
            display: inline-block;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(36px, 5vw, 60px);
            line-height: 1.1;
            font-weight: 800;
            max-width: 750px;
            margin-bottom: 24px;
        }

        .hero p {
            font-size: 18px;
            color: #8b949e;
            max-width: 540px;
            margin-bottom: 36px;
        }

        .btn-primary {
            display: inline-block;
            background: var(--accent);
            color: #0e1116;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            color: #fff;
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            margin-top: 70px;
            padding-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .stat-item strong {
            display: block;
            font-size: 24px;
            color: #fff;
            margin-bottom: 4px;
        }

        .stat-item span {
            font-size: 14px;
            color: #8b949e;
        }

        /* Section Common */
        section {
            padding: 90px 0;
        }

        .section-tag {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        .section-title {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 800;
            margin-bottom: 12px;
        }

        .section-subtitle {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 48px;
        }

        /* Catalog */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 24px;
        }

        .product-card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: box-shadow 0.2s, transform 0.2s;
            background: #fff;
        }

        .product-card:hover {
            box-shadow: 0 12px 30px rgba(0,0,0,0.06);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-in {
            background: #dafbe1;
            color: #116329;
        }

        .status-pre {
            background: #fff8c5;
            color: #7d4e00;
        }

        .card-num {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .series-label {
            font-size: 11px;
            letter-spacing: 1.2px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .product-card h3 {
            font-size: 24px;
            margin-bottom: 14px;
        }

        .specs-short {
            list-style: none;
            margin-bottom: 24px;
            padding: 14px;
            background: var(--bg-light);
            border-radius: 10px;
            font-size: 14px;
        }

        .specs-short li {
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .specs-short li:last-child {
            margin-bottom: 0;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .price {
            font-size: 24px;
            font-weight: 800;
        }

        .delivery-note {
            font-size: 13px;
            color: var(--text-muted);
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            padding: 11px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-outline:hover {
            border-color: var(--text-main);
            background: var(--bg-light);
        }

        .btn-add {
            background: var(--bg-dark);
            color: #fff;
            border: none;
            padding: 11px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add:hover {
            background: var(--accent);
            color: #0e1116;
        }

        /* Advantages */
        .bg-gray {
            background: var(--bg-light);
        }

        .adv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            margin-bottom: 50px;
        }

        .adv-card {
            background: #fff;
            padding: 28px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .adv-num {
            font-size: 13px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 12px;
            display: block;
        }

        .adv-card h4 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .adv-card p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .dealer-box {
            background: var(--bg-dark);
            color: #fff;
